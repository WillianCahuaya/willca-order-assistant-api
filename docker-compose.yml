services:

  mongodb:
    image: mongo:8
    container_name: willca-mongodb
    restart: unless-stopped
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: admin
      MONGO_INITDB_ROOT_PASSWORD: 12345
    volumes:
      - mongodb_data:/data/db

  rag-postgres:
    image: pgvector/pgvector:pg16
    container_name: willca-rag-postgres
    restart: unless-stopped
    ports:
      - "5433:5432"
    environment:
      POSTGRES_DB: willca_rag
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - rag-postgres-data:/var/lib/postgresql/data

volumes:
  mongodb_data:
  rag-postgres-data:

#docker compose up -d rag-postgres
#docker compose down rag-postgres