services:

  ollama:
    image: ollama/ollama
    container_name: willca-ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama-data:/root/.ollama

  ollama-init:
    image: ollama/ollama
    container_name: willca-ollama-init
    depends_on:
      - ollama
    entrypoint: >
      sh -c "
        sleep 5;
        ollama pull llama3.2
      "
    environment:
      - OLLAMA_HOST=http://ollama:11434

volumes:
  ollama-data: